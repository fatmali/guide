<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
  <title>The Travel Journal</title>
  <meta name="description" content="A travelling journal — one book for every journey. Stamps pressed, photographs kept, notes in the margin." />
  <meta name="theme-color" content="#F2ECDF" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#15130E" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Travel Journal" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/icon-180.png" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/leaflet/leaflet.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <header class="masthead">
    <div class="masthead__mark">The Travel <b>Journal</b></div>
    <div class="masthead__right">
      <div class="masthead__day" id="mastDay">Cover</div>
      <button class="iconbtn" id="themeBtn" aria-label="Toggle light and dark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8L6 18M18 6l1.8-1.8"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="pager" id="pager" aria-label="The Travel Journal, day by day"></main>

  <nav class="spine" id="spine" aria-label="Days"></nav>

  <!-- Passport overlay -->
  <section class="sheet" id="passport" aria-hidden="true" aria-label="Passport">
    <div class="sheet__bar">
      <span class="sheet__title">Passport · Stamps collected</span>
      <button class="iconbtn" id="passportClose" aria-label="Close passport">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="sheet__body">
      <p class="passport__intro" id="passportIntro"></p>
      <div class="pages" id="passportPages"></div>
      <div class="keepsake">
        <div class="keepsake__label">Your journal · this device</div>
        <p class="keepsake__note">Stamps, notes and photographs are saved on this device. Back it up to a file to keep it safe, carry it to another phone, or send it to your partner — then Restore to load it there.</p>
        <div class="keepsake__row">
          <button class="keepsake__btn" id="backupBtn" type="button">Back up / Share</button>
          <button class="keepsake__btn keepsake__btn--ghost" id="restoreBtn" type="button">Restore from file</button>
          <input id="restoreInput" type="file" accept="application/json,.json" hidden />
        </div>
        <div class="keepsake__status" id="keepsakeStatus" aria-live="polite"></div>
      </div>
    </div>
  </section>

  <script src="assets/leaflet/leaflet.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
