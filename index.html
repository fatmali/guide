<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
  <title>The London Journal</title>
  <meta name="description" content="A slow four days in London — notes from an architect friend. 16–19 July, then York." />
  <meta name="theme-color" content="#F2ECDF" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#15130E" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="London Journal" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/icon-180.png" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <header class="masthead">
    <div class="masthead__mark">The London <b>Journal</b></div>
    <div class="masthead__right">
      <div class="masthead__day" id="mastDay">Cover</div>
      <button class="iconbtn" id="themeBtn" aria-label="Toggle light and dark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8L6 18M18 6l1.8-1.8"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="pager" id="pager" aria-label="The London Journal, day by day"></main>

  <nav class="spine" id="spine" aria-label="Days"></nav>

  <!-- Passport overlay -->
  <section class="sheet" id="passport" aria-hidden="true" aria-label="Passport">
    <div class="sheet__bar">
      <span class="sheet__title">Passport · Stamps collected</span>
      <button class="iconbtn" id="passportClose" aria-label="Close passport">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="sheet__body">
      <p class="passport__intro" id="passportIntro"></p>
      <div class="pages" id="passportPages"></div>
    </div>
  </section>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
